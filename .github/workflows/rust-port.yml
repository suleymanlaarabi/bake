name: rust-port

on:
  push:
    branches: ['chatgpt/rust-port-validation']
  workflow_dispatch:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack bakers source
        shell: bash
        run: |
          cat .ci/bakers-port-0* | base64 --decode > port.tar.gz
          echo '02bef2cffe36afc44f69232f8ec95f2c9fe8e1aa81dc42026812ccb6be2e98fb  port.tar.gz' | sha256sum -c -
          tar -xzf port.tar.gz
      - name: Install Rust 1.98.1
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
      - name: Enable MSVC build tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Format
        working-directory: bake-rust-port
        run: cargo fmt
      - name: Clippy
        working-directory: bake-rust-port
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: bake-rust-port
        run: cargo test --all-targets
      - name: Release build
        working-directory: bake-rust-port
        run: cargo build --release

  siecs:
    needs: rust
    runs-on: ubuntu-24.04
    env:
      BAKE_HOME: ${{ runner.temp }}/bake-home
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - name: Unpack bakers source
        shell: bash
        run: |
          cat .ci/bakers-port-0* | base64 --decode > port.tar.gz
          echo '02bef2cffe36afc44f69232f8ec95f2c9fe8e1aa81dc42026812ccb6be2e98fb  port.tar.gz' | sha256sum -c -
          tar -xzf port.tar.gz
      - name: Install Rust 1.98.1
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Build bakers
        working-directory: bake-rust-port
        run: cargo build --release
      - name: Clone siecs
        run: git clone https://github.com/suleymanlaarabi/siecs.git
      - name: Build siecs recursively
        working-directory: siecs
        run: ../bake-rust-port/target/release/bakers rebuild . -r --cfg debug
      - name: Run exact user scenario
        working-directory: siecs
        run: ../bake-rust-port/target/release/bakers test
      - name: Build and run C++ tests
        working-directory: siecs
        run: |
          ../bake-rust-port/target/release/bakers rebuild test/cpp -r --cfg debug
          ../bake-rust-port/target/release/bakers run test/cpp --cfg debug
